name: release

# Build a self-contained `odw` binary for every platform and attach them to the
# GitHub Release. SEA injects the blob into the *host's* node binary, so there is
# no cross-compiling — each target is built on its own runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Run all JavaScript actions on Node 24 (the Node 20 action runtime is deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ODW_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Version generation checks tag, package, lockfile and source revision.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  binary:
    needs: verify
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No darwin-x64: GitHub's Intel macOS runners (macos-13) are being retired
        # and queue indefinitely. Intel-mac users build from source (see install.sh).
        include:
          - { runner: macos-14,         os: darwin, arch: arm64 }
          - { runner: ubuntu-latest,    os: linux,  arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
          - { runner: windows-latest,   os: win,    arch: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build:binary
      - name: Name + compress the artifact
        shell: bash
        run: |
          # The binary is ~110 MB (almost entirely the embedded Node runtime);
          # gzip -9 cuts the *download* to ~30–40 MB on every platform. gzip is
          # lossless, so the macOS code signature survives the round-trip.
          ext=""; [ "${{ matrix.os }}" = "win" ] && ext=".exe"
          bin="odw-${{ matrix.os }}-${{ matrix.arch }}$ext"
          mv "build/odw$ext" "$bin"
          gzip -9 "$bin"
          echo "ASSET=$bin.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Publish only after all four verified binaries exist, avoiding partial releases.
      - uses: actions/download-artifact@v4
        with:
          pattern: odw-*
          path: artifacts
          merge-multiple: true
      # scripts/install.sh verifies the downloaded binary against this list.
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum odw-*.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/odw-*.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
