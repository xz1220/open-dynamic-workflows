name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # package.json engines says node >=20: test every supported line on Linux,
        # plus macOS (the darwin-arm64 binary's platform) on the current one.
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "24" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds the web client, re-embeds it and SKILL.md, then runs tsc over src
      # (which is also the typecheck, so no separate `npm run typecheck`).
      - run: npm run build
      - name: Committed generated files match their sources
        run: git diff --exit-code -- src/dashboard.generated.ts
      - name: Typecheck the web client
        run: npx tsc -p web/tsconfig.json
      # The Claude Code dialect conformance suite (conformance/), on the built CLI.
      - name: Dialect conformance suite
        run: node dist/cli.js conformance
      - run: npm test

  # The container sandbox on a real engine: the tests pin its argv against a
  # fake engine; this runs it under Docker, which ubuntu-latest has.
  sandbox-real:
    name: sandbox (ubuntu-latest, real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: scripts/ci/sandbox-real.sh

  # odw run --on ssh:// against a real sshd: a second local user stands in for
  # the server. The tests use a fake ssh; this checks the real thing.
  remote-real:
    name: remote (ubuntu-latest, real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: scripts/ci/remote-real.sh

  # The full suite leans on POSIX shells (installer, worker, adapter stubs), so
  # Windows gets a build plus a smoke check of the CLI the release ships.
  windows-smoke:
    name: smoke (windows-latest, Node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Windows release binary embeds what this runner generates.
      - name: Committed generated files match their sources
        run: git diff --exit-code -- src/dashboard.generated.ts
      - name: CLI smoke check
        shell: bash
        run: |
          version="$(node dist/cli.js --version)"
          echo "$version"
          case "$version" in "open-dynamic-workflows "*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
          node dist/cli.js --help | grep "odw run <script.js|name>" > /dev/null
